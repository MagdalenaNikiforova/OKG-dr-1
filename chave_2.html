<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 40, aspect );
			camera.position.set( 6, 2, 20);
			camera.lookAt( scene.position );		


			var light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, 9 );
			scene.add( light );

			light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, -9 );
			scene.add( light );

			var pose2 = new THREE.Group();
			scene.add( pose2 );

            //glava
            var geometry = new THREE.BoxGeometry(1.5, 1.5, 1);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0xffddd4); 
			var head = new THREE.Mesh(geometry, material);
            head.position.set(0, 0, 0)		
			pose2.add(head);

            //vrat
            var geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0xffddd4); 
			var neck = new THREE.Mesh(geometry, material);
            neck.position.set(0, -1, 0)		
			pose2.add(neck);

            //tors
            var geometry = new THREE.BoxGeometry(2, 3.5, 1.5);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0xfc1380); 
			var neck = new THREE.Mesh(geometry, material);
            neck.position.set(0, -3, 0)		
			pose2.add(neck);
            
            for(var x=1; x>-3; x-=2)
            {
                //ramo
                var geometry = new THREE.BoxGeometry(0.25, 0.5, 1);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xffddd4); 
                var shoulder = new THREE.Mesh(geometry, material);
                shoulder.position.set(1.13*x, -1.5, 0)		
                pose2.add(shoulder);
                //ryka
                var geometry = new THREE.BoxGeometry(0.5, 3, 1);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xffddd4); 
                var arm = new THREE.Mesh(geometry, material);
                arm.position.set(1.5*x, -0.25, 0)		
                pose2.add(arm);

                //krak
                var geometry = new THREE.BoxGeometry(0.75, 3, 1);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xfc68ae); 
                var leg = new THREE.Mesh(geometry, material);
                leg.position.set(0.5*x, -6, 0)		
                pose2.add(leg);
            }

            pose2.position.set(0, 2, 0);

			scene.add(pose2);

            pose2.position.set(4, 2, 0);

			scene.add(pose2);

			scene.background = new THREE.Color(0xadd8e6);
			function drawFrame( t )
			{
				scene.rotation.y = t/2000;
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
