<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 50, aspect );
			camera.position.set( 6, 7, 20);
			camera.lookAt( scene.position );		


			var light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, 9 );
			scene.add( light );

			light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, -9 );
			scene.add( light );


            

            //основа на сцената
            /*const colors = [0x8c1e80, 0x7c1779, 0x6d1371];
            var i = 2;
            var size = 12;
            for(var x=-2; x<1; x+=1)
            for(var y=-1; y<0.5; y+=0.5)
            {
                var geometry = new THREE.BoxGeometry(size, 0.5, size);
                size-=2;
                var material = new THREE.MeshPhongMaterial();
                material.color.set(colors[i]);
                --i; 
                var stage = new THREE.Mesh(geometry, material);
                stage.position.set(x, y, 0)		
                scene.add(stage);

            }*/
            var geometry = new THREE.BoxGeometry(8, 0.5, 8);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x8c1e80); 
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(0, 0, 0)		
			scene.add(stage);
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(4, 0, -4);	
			scene.add(stage);

            var geometry = new THREE.BoxGeometry(10, 0.5, 10);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x7c1779); 
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(-1, -0.5, 0)		
			scene.add(stage);
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(4, -0.5, -5);	
			scene.add(stage);

            var geometry = new THREE.BoxGeometry(12, 0.5, 12);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x6d1371); 
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(-2, -1, 0)		
			scene.add(stage);
			var stage = new THREE.Mesh(geometry, material);
            stage.position.set(4, -1, -6);	
			scene.add(stage);

            //син фон за кеф
            scene.background = new THREE.Color(0xadd8e6);
            scene.background = new THREE.Texture(CubeTexture);
			
			function drawFrame( t )
			{
				scene.rotation.y = t/2000;
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
