<html>
	<head>
		<style>
			body { margin: 0; overflow: hidden; }
			canvas { width: 100%; height: 100%; }
		</style>
		<script type="importmap">
			{ "imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js"
			} }
		</script>
	</head>
	<body>
		<script type="module">
		
			import * as THREE from "three";			
			var renderer = new THREE.WebGLRenderer();
			renderer.setSize( window.innerWidth, window.innerHeight );
			renderer.setAnimationLoop( drawFrame );
			document.body.appendChild( renderer.domElement );

			var scene = new THREE.Scene();
			
			var aspect = window.innerWidth/window.innerHeight;
			var camera = new THREE.PerspectiveCamera( 50, aspect );
			camera.position.set( 30, 12, 30);
			camera.lookAt( 0, 4, 0 );		


			var light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, 9 );
			scene.add( light );

			light = new THREE.PointLight( 'white', 200 );
			light.position.set( 3, 7, -9 );
			scene.add( light );


            //основа на сцената
            {const colors = [0x5d30af, 0x7d59bf, 0x9e83cf];
            var y=0;
            var size = 12;
            for(var i=0; i<3; i++)
            {
                    var geometry = new THREE.BoxGeometry(size, 0.5, size);
                    size += 4;
                    var material = new THREE.MeshPhongMaterial();
                    material.color.set(colors[i]); 
                    var stage = new THREE.Mesh(geometry, material);
                    stage.position.set(0, y, 0);
                    scene.add(stage);
                    var stage = new THREE.Mesh(geometry, material);
                    stage.position.set(6, y, -6);	
                    y-=0.5;
                    scene.add(stage);
            }}

            //колона за музиката
            {var geometry = new THREE.BoxGeometry(6, 15, 6);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x5d30af);
            var bass = new THREE.Mesh(geometry, material);
            bass.position.set(-7, 6.25, -13 );
            scene.add(bass);}

            //странични "екрани"
            {var geometry = new THREE.BoxGeometry(26, 15, 1);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x7d59bf);
            var display = new THREE.Mesh(geometry, material);
            display.position.set(3, 6.25, -16);
            scene.add(display);

            var geometry = new THREE.BoxGeometry(1, 15, 26);
            var material = new THREE.MeshPhongMaterial();
            material.color.set(0x7d59bf);
            var display = new THREE.Mesh(geometry, material);
            display.position.set(-10, 6.25, -3);
            scene.add(display);}

            //speaker-i
            {var geometry = new THREE.TorusGeometry(1.5, 0.25, 16, 100); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-6.5, 4, -10);
            scene.add(circle);
            var geometry = new THREE.SphereGeometry(1, 32, 16); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-6.5, 4, -10);
            scene.add(circle);

            var geometry = new THREE.TorusGeometry(1, 0.15, 16, 100); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-6.5, 9, -10);
            scene.add(circle);
            var geometry = new THREE.SphereGeometry(0.7, 32, 16); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-6.5, 9, -10);
            scene.add(circle);


            var geometry = new THREE.TorusGeometry(1.5, 0.25, 16, 100); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-4, 4, -13);
            circle.rotation.y = Math.PI/2;
            scene.add(circle);
            var geometry = new THREE.SphereGeometry(1, 32, 16); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-4, 4, -13);
            scene.add(circle);

            var geometry = new THREE.TorusGeometry(1, 0.15, 16, 100); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.rotation.y = Math.PI/2;
            circle.position.set(-4, 9, -13);
            scene.add(circle);
            var geometry = new THREE.SphereGeometry(0.7, 32, 16); 
            var material = new THREE.MeshBasicMaterial({color:0xff0ff});
            var circle = new THREE.Mesh(geometry, material);
            circle.position.set(-4, 9, -13);
            scene.add(circle);
            }

            //син фон за кеф
            

            //beams za osvetlenieto
            {var geometry = new THREE.BoxGeometry(26, 1, 3);
            var material = new THREE.MeshPhongMaterial({color:0xff0ff});
            var beam = new THREE.Mesh(geometry, material);
            beam.position.set(3, 14.25, -15);
            scene.add(beam);
            var geometry = new THREE.BoxGeometry(3, 1, 26);
            var material = new THREE.MeshPhongMaterial({color:0xff0ff});
            var beam = new THREE.Mesh(geometry, material);
            beam.position.set(-9, 14.25, -3);
            scene.add(beam);
            }
			
            //projektori
            /*var projector = new THREE.SpotLight(0xffffff, 5, -2);
            scene.add( projector );*/


            scene.background = new THREE.Color(0xadd8e6);
			function drawFrame(t)
			{
				scene.rotation.y = t/2000;
				renderer.render( scene, camera );
			}
			
		</script>
	</body>
</html>
