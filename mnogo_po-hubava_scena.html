            //hora
            function drawPerson_1(xx, y, z)
            {
                var pose1 = new THREE.Group();
                scene.add( pose1 );

                //glava
                var geometry = new THREE.BoxGeometry(0.75, 0.75, 0.5);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xffddd4); 
                var head = new THREE.Mesh(geometry, material);
                head.position.set(0, 0, 0)		
                pose1.add(head);

                //vrat
                var geometry = new THREE.BoxGeometry(0.25, 0.25, 0.25);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xffddd4); 
                var neck = new THREE.Mesh(geometry, material);
                neck.position.set(0, -0.5, 0)		
                pose1.add(neck);

                //tors
                var geometry = new THREE.BoxGeometry(1, 1.75, 0.75);
                var material = new THREE.MeshPhongMaterial();
                material.color.set(0xfc1380); 
                var neck = new THREE.Mesh(geometry, material);
                neck.position.set(0, -1.5, 0)		
                pose1.add(neck);
                
                for(var x=1; x>-3; x-=2)
                {
                    //ramo
                    var geometry = new THREE.BoxGeometry(0.13, 0.25, 0.5);
                    var material = new THREE.MeshPhongMaterial();
                    material.color.set(0xffddd4); 
                    var shoulder = new THREE.Mesh(geometry, material);
                    shoulder.position.set(0.57*x, -0.75, 0)		
                    pose1.add(shoulder);
                    //ryka
                    var geometry = new THREE.BoxGeometry(0.25, 1.5, 0.5);
                    var material = new THREE.MeshPhongMaterial();
                    material.color.set(0xffddd4); 
                    var arm = new THREE.Mesh(geometry, material);
                    arm.position.set(0.75*x, -1.37, 0)		
                    pose1.add(arm);

                    //krak
                    var geometry = new THREE.BoxGeometry(0.37, 1.5, 0.5);
                    var material = new THREE.MeshPhongMaterial();
                    material.color.set(0xfc68ae); 
                    var leg = new THREE.Mesh(geometry, material);
                    leg.position.set(0.25*x, -3, 0)		
                    pose1.add(leg);
                }

                scene.add(pose1);
                pose1.position.set(xx,y,z);
                return pose1;
            }

                for(var x=1; x>-3; x-=2)

            scene.background = new THREE.Color(0xadd8e6);
			function drawFrame(t)
			{
                var cycle = Math.floor(t / 2000);
                if (cycle % 2 === 0) {
                    people_1.visible = true;
                    people_2.visible = false;
                } else {
                    people_1.visible = false;
                    people_2.visible = true;
                }

				scene.rotation.y = t/2000;
				renderer.render( scene, camera );
			}
